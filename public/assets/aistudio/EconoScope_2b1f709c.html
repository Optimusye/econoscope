<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), f1=v=>Number(v).toFixed(1);

const hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
function rnd(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647}
const srcTag=s=>`<span class="tag" style="color:${SRC_C[s]};border-color:${SRC_C[s]}55;background:${SRC_C[s]}14">${s}</span>`;

/* ---------- reference data (all simulated) ---------- */
const REG={
 global:{n:'Global',ic:'globe',rt:6.8,off:4.1,sp:41,sig:14280,thr:'ELEVATED',box:[-180,-58,180,78]},
 eafrica:{n:'East Africa',ic:'map-pin',rt:27.4,off:13.2,sp:78,sig:2140,thr:'CRITICAL',box:[18,-16,56,26]},

 americas:{n:'Americas',ic:'map-pin',rt:8.7,off:6.0,sp:33,sig:3000,thr:'WATCH',box:[-128,-42,-30,52]}};

function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const[xi,yi]=p[i],[xj,yj]=p[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
const isLand=(x,y)=>Object.values(POLY).some(p=>inPoly(x,y,p))&&!HOLES.some(h=>inPoly(x,y,h));
const MW=1000,MH=470,px=lo=>(lo+180)/360*MW,py=la=>(78-la)/136*MH;
const landCache={};
function boxVB(b){return[px(b[0]),py(b[3]),px(b[2])-px(b[0]),py(b[1])-py(b[3])]}
function landPath(reg){if(landCache[reg])return landCache[reg];const b=REG[reg].box,vb=boxVB(b),k=vb[2]/MW,step=clamp(1.8*Math.sqrt(k),.5,1.8);let d='';
 for(let la=b[3]+step;la>=b[1]-step;la-=step)for(let lo=b[0]-step;lo<=b[2]+step;lo+=step)if(isLand(lo,la))d+=`M${px(lo).toFixed(1)} ${py(la).toFixed(1)}h0`;
 return landCache[reg]={d,sw:+(1.25*step).toFixed(2)}}
function hotSev(h){const a=getAlert(h.al);let sev=a?a.sev:'WATCH';SHOCK.slice(0,S.shock).forEach(s=>{if(SHOCK_HOT[s.id]===h.id)sev='CRITICAL'});return sev}
function mapSVG(){const reg=S.region,vb=boxVB(REG[reg].box),k=vb[2]/MW,u=Math.max(.34,Math.sqrt(k)),lp=landPath(reg),cur=S.vb||vb;
 const on=h=>reg==='global'||h.reg.includes(reg);
 const risk=S.layers.risk?HOT.map(h=>{const sev=hotSev(h),c=SEVH[sev],x=px(h.lon),y=py(h.lat),r=(sev==='CRITICAL'?7.5:6)*u,dim=on(h)?1:.22;
  return`<g class="hot" data-act="hot" data-id="${h.id}" tabindex="0" role="button" aria-label="${h.n}, ${sev}" opacity="${dim}">${sev==='CRITICAL'?`<circle class="ring" cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`:''}<circle class="c" cx="${x}" cy="${y}" r="${r}" fill="${c}" fill-opacity=".85" stroke="#06090F" stroke-width="${1.6*u}"/><text x="${x+r+3*u}" y="${y+4*u}" font-size="${12*u}" fill="#E2E8F0" stroke="#06090F" stroke-width="${3*u}" paint-order="stroke" font-weight="600">${h.n}</text></g>`}).join(''):'';
 const chk=S.layers.choke?CHK.map(c=>{const x=px(c.lon),y=py(c.lat),s=5*u,col=c.st==='DISRUPTED'?'#EF4444':c.st==='CONGESTED'?'#F59E0B':'#10B981',dim=reg==='global'||c.reg.includes(reg)?1:.22;
  return`<g opacity="${dim}"><path d="M${x} ${y-s}L${x+s} ${y}L${x} ${y+s}L${x-s} ${y}Z" fill="none" stroke="${col}" stroke-width="${1.8*u}"/><title>${c.n}: ${c.st}</title></g>`}).join(''):'';
 const grid=[-60,-30,0,30,60,90,120,150].map(lo=>`<line x1="${px(lo)}" x2="${px(lo)}" y1="0" y2="${MH}" stroke="#13203a" stroke-width="${.8*u}"/>`).join('')+[-30,0,30,60].map(la=>`<line y1="${py(la)}" y2="${py(la)}" x1="0" x2="${MW}" stroke="#13203a" stroke-width="${.8*u}"/>`).join('');
 return`<svg id="mapsvg" viewBox="${cur.join(' ')}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dotted world map with risk nodes and chokepoints">${grid}<path class="land" d="${lp.d}" stroke-width="${lp.sw}"/>${chk}${risk}</svg>`}
function tweenVB(){const svg=$('#mapsvg');if(!svg)return;const to=boxVB(REG[S.region].box),from=S.vb||to,t0=performance.now();
 (function st(t){const p=clamp((t-t0)/550,0,1),e=1-Math.pow(1-p,3),v=from.map((f,i)=>f+(to[i]-f)*e);S.vb=v;svg.setAttribute('viewBox',v.join(' '));if(p<1)requestAnimationFrame(st)})(t0)}

function alertCard(a){const isNew=a.id[0]==='s';return`<button class="al ${SEVC[a.sev]}" data-act="alert" data-id="${a.id}"><div class="r1"><span class="badge ${SEVC[a.sev]}">${a.sev}</span><span class="mut">${a.cat}</span>${isNew?'<span class="new">NEW</span>':''}</div><h4>${a.title}</h4>
 <div class="ld">${icon('clock-3')} Detected <b class="mono">${a.lead} days</b> ahead of official CPI print</div>
 <div class="cfr"><b class="mono">${a.conf.toFixed(1)}% Confidence</b>${triBar(a)}</div><div class="tt mono">${triTxt(a)}</div><div class="why">${icon('sparkles')} Why this alert?</div></button>`}
function gauge(p,size=64){const r=size/2-6,c=2*Math.PI*r,col=p>=70?'#EF4444':p>=45?'#F59E0B':'#10B981';
 return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${Math.round(p)} percent"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#162033" stroke-width="6"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="#E2E8F0" font-size="${size/4.2}" font-weight="700" font-family="JetBrains Mono,monospace">${Math.round(p)}%</text></svg>`}
function animateNums(){$$('[data-to]').forEach(el=>{const to=+el.dataset.to,d=+(el.dataset.d||1),s=el.dataset.s||'',t0=performance.now();(function st(t){const p=clamp((t-t0)/600,0,1),e=1-Math.pow(1-p,3);el.textContent=(to*e).toFixed(d)+s;if(p<1)requestAnimationFrame(st)})(t0)})}
function mk(id,cfg){const el=document.getElementById(id);if(!el)return;if(typeof Chart==='undefined'){el.parentElement.innerHTML='<p class="mut p12">Chart.js did not load. Check your internet connection and reload.</p>';return}if(CH[id])CH[id].destroy();CH[id]=new Chart(el,cfg)}
const AX=(extra={})=>({grid:{color:'rgba(30,41,59,.7)'},ticks:{font:{family:'JetBrains Mono',size:10},maxTicksLimit:8},...extra});
function lineCfg(lab,rt,off,rtName){return{type:'line',data:{labels:lab,datasets:[
 {label:rtName,data:rt,borderColor:'#06B6D4',borderWidth:2.5,pointRadius:0,pointHoverRadius:4,tension:.35,fill:true,backgroundColor:c=>{const g=c.chart.ctx.createLinearGradient(0,0,0,300);g.addColorStop(0,'rgba(6,182,212,.32)');g.addColorStop(1,'rgba(6,182,212,0)');return g}},
 {label:'Official CPI (lagging)',data:off,borderColor:'#10B981',borderWidth:2,borderDash:[6,4],pointRadius:0,stepped:'before',fill:false}]},
 options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{boxWidth:10,usePointStyle:true,font:{size:11}}},tooltip:{backgroundColor:'#0D131F',borderColor:'#1E293B',borderWidth:1,titleFont:{family:'JetBrains Mono'},bodyFont:{family:'JetBrains Mono'},callbacks:{label:c=>` ${c.dataset.label}: ${c.parsed.y.toFixed(2)}%`}}},scales:{x:AX(),y:AX({ticks:{callback:v=>v+'%',font:{family:'JetBrains Mono',size:10}}})}}}}

function impactHTML(a){const T=['1ST ORDER','2ND ORDER','3RD ORDER'];return`<div class="impg">${a.imp.map((o,i)=>`<div class="imc"><h6><span>${T[i]}</span><span>${i?'+'+(i*3)+'-'+(i*6)+' wks':'now'}</span></h6>${o.map(([t,p])=>`<div class="imn">${t}<div class="pb2"><i style="width:${p}%"></i></div><div class="mono dim" style="font-size:10px;margin-top:3px">${p}% likelihood</div></div>`).join('')}</div>`).join('')}</div><button class="btn" style="margin-top:12px" data-act="alert" data-id="${a.id}">${icon('sparkles')} Open AI explanation</button>`}
function drawMain(){const m=M(),r=REG[S.region],lab=labels(),rt=series('rt'+S.region,m.off*.85,m.rt-S.shock*.8,m.rt*.045,S.shock?S.shock*m.rt*.07:0);mk('cMain',lineCfg(lab,rt,officialS(m.off*.85,m.off),'EconoScope Real-Time Index'))}

function bk(b){const f=clamp(REG[S.region].rt/6.8,.5,3.6),rt=b.rt*Math.pow(f,.8)+S.shock*.6,off=b.off*Math.pow(f,.45);return{...b,rt,off}}

  <div class="panel"><div class="ph"><h3>${icon('container')} Port congestion: average wait (days)</h3></div><div class="chart" style="height:${Math.max(220,pt.length*34+40)}px"><canvas id="cPort"></canvas></div></div></section>
 <section class="panel"><div class="ph"><h3>${icon('table-2')} Port congestion metrics (simulated)</h3></div><div class="scr"><table><thead><tr><th>PORT</th><th class="r">AVG WAIT</th><th class="r">VESSELS IN QUEUE</th><th class="r">VS 30D AVERAGE</th></tr></thead><tbody>${pt.map(p=>`<tr><td>${p.n}</td><td class="r mono">${f1(p.w*k)}d</td><td class="r mono">${Math.round(p.v*k)}</td><td class="r mono ${p.d>25?'dn':'up'}">+${Math.round(p.d*k)}%</td></tr>`).join('')}</tbody></table></div></section></div>`}
function drawPort(){const k=1+S.shock*.07,pt=PORTS.filter(p=>S.region==='global'||p.reg.includes(S.region));mk('cPort',{type:'bar',data:{labels:pt.map(p=>p.n),datasets:[{data:pt.map(p=>+(p.w*k).toFixed(1)),backgroundColor:pt.map(p=>p.w*k>=5?'#EF4444':p.w*k>=3?'#F59E0B':'#10B981'),borderRadius:4}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:AX({ticks:{callback:v=>v+'d',font:{family:'JetBrains Mono',size:10}}}),y:AX()}}})}
function tickCd(){$$('.cd').forEach(el=>{const ms=Math.max(0,+el.dataset.end-Date.now()),d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);el.textContent=`${d}d ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`})}

function sigList(){return SIGS.filter(s=>(S.region==='global'||s.reg.includes(S.region))&&(S.sigF==='All'||s.src===S.sigF)).sort((a,b)=>a.t-b.t)}
function vSignals(){const list=sigList(),sel=SIGS.find(s=>s.id===S.sigSel&&list.includes(s))||list[0],a=sel?getAlert(sel.al):null;
 return`<div class="view"><div class="regbar"><span>SOURCE</span>${['All','Forbes','World Bank','FAO','X/Social Velocity','GDELT','Spot Markets'].map(s=>`<button class="chip" aria-pressed="${S.sigF===s}" data-act="sigf" data-id="${s}">${s}</button>`).join('')}</div>
 <section class="sg"><div class="panel"><div class="ph"><h3>${icon('radio-tower')} Live multi-source feed (simulated)</h3><span class="grow"></span><span class="mono dim">${list.length} items</span></div><div class="sgl" id="sgl">${list.map(s=>`<button class="sr ${s.fresh?'fresh':''}" data-act="sig" data-id="${s.id}" aria-pressed="${sel&&s.id===sel.id}"><span class="mono dim">${s.t<60?s.t+'m':Math.round(s.t/60)+'h'}</span><span style="display:grid;gap:5px"><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${srcTag(s.src)}<span class="mono dim" style="font-size:10px">${s.reg.filter(r=>r!=='global').map(r=>REG[r].n).join(', ')||'Global'}</span></span><span>${s.txt}</span></span></button>`).join('')||'<p class="mut p12">No signals match these filters.</p>'}</div></div>
 <div class="panel"><div class="ph"><h3>${icon('brain-circuit')} AI reasoning pipeline</h3></div><div class="pb">${sel?`<div class="stg"><h6>${icon('inbox')} 1. RAW SIGNAL</h6><div>${sel.txt}</div><div class="mono dim" style="margin-top:6px;font-size:10.5px">${sel.src} &bull; ${sel.t<60?sel.t+' min':Math.round(sel.t/60)+' h'} ago &bull; simulated item</div></div>
 <div class="stg"><h6>${icon('tags')} 2. ENTITY EXTRACTION</h6>${sel.ents.map(e=>`<span class="ent"><small>${e[0]}</small>${e[1]}</span>`).join('')}</div>
 <div class="stg"><h6>${icon('git-branch')} 3. CAUSAL CHAIN</h6><div class="cz">${a.chain.map((c,i)=>`<div><span>${i+1}</span>${c}</div>`).join('')}</div></div>
 <div class="stg"><h6>${icon('shield-check')} 4. TRIANGULATION AND ALERT</h6><div class="cfr"><b class="mono">${a.conf.toFixed(1)}% Confidence</b>${triBar(a)}</div><div class="tt mono" style="margin:6px 0 10px">${triTxt(a)}</div><button class="btn" data-act="alert" data-id="${a.id}">${icon('sparkles')} Open AI explanation</button></div>`:'<p class="mut">Select a signal.</p>'}</div></div></section></div>`}

/* ---------- drawer ---------- */
function openDrawer(id){const a=getAlert(id);if(!a)return;const c=2*Math.PI*34,mx=Math.max(a.src[0],a.src[1],1),tri=[['Official datasets',a.src[0],'#10B981'],['News wires',a.src[1],'#06B6D4'],['Social signals',a.src[2],'#F472B6']];
 $('#drawer').innerHTML=`<div class="dh"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="badge ${SEVC[a.sev]}">${a.sev}</span><span class="mut">${a.cat}</span><span class="grow"></span><button class="btn" data-act="close" aria-label="Close drawer">${icon('x')} Close</button></div><h2>${a.title}</h2><div class="ld mono" style="color:#7dd3fc;font-size:12px">${icon('clock-3')} Detected ${a.lead} days ahead of official CPI print</div></div>
 <div class="db"><section><h5>${icon('sparkles')} WHY THIS ALERT?</h5><p style="margin:0;font-size:13.5px;line-height:1.6">${a.why}</p></section>
 <section><h5>${icon('shield-check')} EVIDENCE CONFIDENCE</h5><div style="display:flex;gap:16px;align-items:center;margin-bottom:12px"><svg width="86" height="86" viewBox="0 0 86 86"><circle cx="43" cy="43" r="34" fill="none" stroke="#162033" stroke-width="8"/><circle cx="43" cy="43" r="34" fill="none" stroke="#06B6D4" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c*a.conf/100} ${c}" transform="rotate(-90 43 43)"/><text x="43" y="43" text-anchor="middle" dominant-baseline="central" fill="#E2E8F0" font-family="JetBrains Mono,monospace" font-weight="700" font-size="15">${a.conf.toFixed(1)}%</text></svg><div class="mut" style="font-size:12px">Confidence rises when independent source types agree and when sources are reliable and fresh.</div></div>
 <div class="trib">${tri.map(t=>`<div><span class="mut">${t[0]}</span><div class="hb"><i style="width:${clamp(Math.log10(t[1]+1)/Math.log10(a.src[2]+1)*100,6,100)}%;background:${t[2]}"></i></div><b class="mono">${t[1].toLocaleString()}</b></div>`).join('')}</div></section>
 <section><h5>${icon('git-branch')} CAUSAL LOGIC</h5><div class="cz">${a.chain.map((x,i)=>`<div><span>${i+1}</span>${x}</div>`).join('')}</div></section>
 <section><h5>${icon('network')} RIPPLE EFFECTS</h5>${impactHTML(a).replace(/<button.*<\/button>/,'')}</section>
 <section><h5>${icon('quote')} SOURCE CITATIONS (SIMULATED FEED ITEMS)</h5>${a.cites.map(x=>`<div class="cite">${srcTag(x[0])}<span>${x[1]}</span></div>`).join('')}</section>
 <section><h5>${icon('history')} HISTORICAL ANALOGS</h5><div class="an"><div style="display:flex;justify-content:space-between;gap:8px"><b>${a.an.y}: ${a.an.t}</b><span class="mono" style="color:var(--cy)">${a.an.s}% similar</span></div><div class="mut" style="margin-top:4px">${a.an.r}</div></div></section>
 <section><h5>${icon('list-checks')} RECOMMENDED ACTIONS</h5><div class="mut" style="font-size:11px;margin-bottom:6px">POLICY</div>${a.act.slice(0,2).map(x=>`<div class="act">${icon('check-circle-2')}<span>${x}</span></div>`).join('')}<div class="mut" style="font-size:11px;margin:10px 0 6px">HEDGING</div>${a.act.slice(2).map(x=>`<div class="act">${icon('shield')}<span>${x}</span></div>`).join('')}</section>
 <section style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="copy" data-id="${a.id}">${icon('clipboard-copy')} Copy briefing</button><button class="btn" data-act="toimpact" data-id="${a.id}">${icon('network')} Show in impact matrix</button></section>
 <p class="dim" style="font-size:10.5px;margin:0">Simulated data for demonstration. Citations show source types, not real articles. Decision support only, not a forecast.</p></div>`;
 $('#drawer').classList.add('on');$('#scrim').classList.add('on');$('#drawer').setAttribute('aria-hidden','false');window.lucide&&lucide.createIcons();$('#drawer').scrollTop=0}
function closeDrawer(){$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');$('#drawer').setAttribute('aria-hidden','true')}

/* ---------- chrome ---------- */
function renderHead(){const m=M(),b=$('#threat');b.className='badge '+SEVC[m.thr];b.innerHTML=`<span class="dot ${m.thr==='CRITICAL'?'cr':m.thr==='ELEVATED'?'am':''}" style="width:7px;height:7px"></span>${REG[S.region].n.toUpperCase()} THREAT: ${m.thr}`;
 $('#tfs').innerHTML=Object.keys(TF).map(t=>`<button data-act="tf" data-id="${t}" aria-pressed="${S.tf===t}">${t}</button>`).join('');
 const sb=$('#shockBtn');sb.classList.toggle('on',S.shock>0);sb.querySelector('span').textContent=S.shock>0?(S.shock<4?'Cascade running...':'Reset simulation'):'Simulate Crisis Shock'}
function renderSide(){$('#side').innerHTML=NAVS.map(n=>`<button class="nav" data-act="tab" data-id="${n[0]}" ${S.view===n[0]?'aria-current="page"':''}>${icon(n[1])}<div><b>${n[2]}</b><span>${n[3]}</span></div></button>`).join('')+
 `<h5>DATA SOURCES</h5><div class="srcs">${['World Bank','FAO FPMA','GDELT','Forbes feed','X / Social Velocity','Spot Markets'].map(s=>`<div><span class="dot" style="width:7px;height:7px"></span>${s} <span class="dim mono" style="margin-left:auto;font-size:9.5px">SIM</span></div>`).join('')}</div><div class="sim">${icon('triangle-alert')} <b>SIMULATED DATA.</b> Illustrative scenario for demonstration. Not real reports, prices or events.</div>`;
 $('#mtabs').innerHTML=NAVS.map(n=>`<button class="chip" data-act="tab" data-id="${n[0]}" aria-pressed="${S.view===n[0]}">${n[2].split(' ')[0]} ${n[2].split(' ')[1]||''}</button>`).join('')}
function renderReg(){$('#regbar').innerHTML='<span>LOCATION ANALYSIS</span>'+Object.entries(REG).map(([k,r])=>`<button class="chip" data-act="region" data-id="${k}" aria-pressed="${S.region===k}">${icon(r.ic)} ${r.n}<i>${alerts().filter(a=>a.regs.includes(k)).length}</i></button>`).join('')}
function render(){renderHead();renderSide();renderReg();const v=$('#view');v.innerHTML={command:vCommand,inflation:vInflation,supply:vSupply,signals:vSignals}[S.view]();
 if(S.view==='command'){drawMain();tweenVB()}if(S.view==='inflation')drawBask();if(S.view==='supply'){drawPort();tickCd()}
 animateNums();if(window.lucide&&lucide.createIcons)lucide.createIcons()}

/* ---------- shock cascade ---------- */
function shockStep(){if(S.shock>=4)return;S.shock++;const a=SHOCK[S.shock-1];toast(`${icon('siren')} <b>${a.sev}</b> ${a.title.replace('SIMULATED SHOCK: ','')}`,'cr');render();if(S.shock<4)setTimeout(shockStep,1500);else toast(`${icon('shield-alert')} Cascade complete. Global threat level set to CRITICAL.`,'cr')}
function shockToggle(){if(S.shock===0){toast('Simulated crisis shock injected. Watch the alert cascade.','am');shockStep()}else if(S.shock>=4){S.shock=0;toast('Simulation reset to baseline.');render()}}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act,id=el.dataset.id;
 if(act==='tab'){S.view=id;render()}else if(act==='region'){S.region=id;render()}else if(act==='tf'){S.tf=id;render()}else if(act==='shock')shockToggle();
 else if(act==='alert')openDrawer(id);else if(act==='hot'){const h=HOT.find(x=>x.id===id),sk=SHOCK.slice(0,S.shock).find(s=>SHOCK_HOT[s.id]===id);openDrawer(sk?sk.id:h.al)}
 else if(act==='layer'){S.layers[id]=!S.layers[id];render()}else if(act==='sigf'){S.sigF=id;render()}else if(act==='sig'){S.sigSel=+id;render()}else if(act==='basket'){S.basket=id;render()}
 else if(act==='close')closeDrawer();
 else if(act==='toimpact'){S.imp=id;S.view='command';if(!getAlert(id).regs.includes(S.region))S.region='global';closeDrawer();render();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
 else if(act==='copy'){const a=getAlert(id),t=`${a.sev} | ${a.title}\nLead: ${a.lead} days ahead of official CPI\nConfidence: ${a.conf.toFixed(1)}% (${triTxt(a)})\nWhy: ${a.why}\nPolicy: ${a.act.slice(0,2).join('; ')}\nHedging: ${a.act.slice(2).join('; ')}\n(Simulated data)`;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Briefing copied to clipboard.')).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Briefing copied to clipboard.')}catch{toast('Copy blocked by the browser. Select the text manually.','am')}ta.remove()})}});
document.addEventListener('change',e=>{if(e.target.id==='impSel'){S.imp=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('hot')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});

/* ---------- live telemetry ---------- */
function drawTick(){const h=TICK.map((t,i)=>`<span class="ti"><b>${t.n}</b><span class="mono" data-tv="${i}">${t.v.toLocaleString(undefined,{maximumFractionDigits:2})}</span><span class="mono ${t.d>=0?'up':'dn'}" data-td="${i}">${t.d>=0?'&#9650;':'&#9660;'} ${Math.abs(t.d).toFixed(2)}%</span></span>`).join('');$('#tick').innerHTML=`<div class="trk">${h}${h}</div><span class="dim" style="position:absolute"></span>`}
setInterval(()=>{TICK.forEach((t,i)=>{const c=(Math.random()-.5)*.004;t.v*=1+c;t.d+=c*100;$$(`[data-tv="${i}"]`).forEach(el=>el.textContent=t.v.toLocaleString(undefined,{maximumFractionDigits:2}));$$(`[data-td="${i}"]`).forEach(el=>{el.className='mono '+(t.d>=0?'up':'dn');el.innerHTML=(t.d>=0?'&#9650; ':'&#9660; ')+Math.abs(t.d).toFixed(2)+'%'})})},1600);
setInterval(()=>{const base=M().sig;S.live=Math.round(base+(Math.random()-.5)*base*.02);$('#status').textContent=`AI INGESTION: ACTIVE • ${S.live.toLocaleString()} SIGNALS/MIN`;$('#clock').textContent=new Date().toISOString().slice(11,19)+' UTC';if(S.view==='supply')tickCd()},1000);
const POOL=[['GDELT','Event cluster: logistics delays in','Tone -3.4'],['X/Social Velocity','Price-complaint velocity rising in','Velocity 3.1x'],['Spot Markets','Quote move with elevated volume in','Vol +18%'],['FAO','Price monitoring series update for','4 markets'],['Forbes','Coverage cluster on supply tightness in','6 items'],['World Bank','Dataset update flagged above band for','+1.2 sd']];
setInterval(()=>{if(S.view!=='signals'||document.hidden)return;const p=POOL[Math.floor(Math.random()*POOL.length)],keys=Object.keys(REG).filter(k=>k!=='global'),k=keys[Math.floor(Math.random()*keys.length)],a=alerts().find(x=>x.regs.includes(k))||ALERTS[0];
 SIGS.forEach(s=>{s.fresh=false;s.t+=0});SIGS.unshift({id:100+(++S.sigN),src:p[0],t:0,reg:[k,'global'],txt:`${p[1]} ${REG[k].n}. ${p[2]}. (simulated)`,ents:[['LOC',REG[k].n],['METRIC',p[2]],['ORG',p[0]]],al:a.id,fresh:true});if(SIGS.length>40)SIGS.pop();render()},7000);

/* ---------- boot ---------- */
if(typeof Chart!=='undefined'){Chart.defaults.color='#94A3B8';Chart.defaults.font.family='Inter, system-ui, sans-serif';Chart.defaults.borderColor='rgba(30,41,59,.7)'}
drawTick();render();
</script>

</body></html>
